name: NBAJAMWS
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  NBAJAMWS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - Info.plist
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: NBA Jam WS
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        CFBundleDocumentTypes:
          - CFBundleTypeName: ZIP archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nbajamws
        PRODUCT_NAME: NBAJAMWS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_C_LANGUAGE_STANDARD: gnu11
        OTHER_LDFLAGS:
          - "$(PROJECT_DIR)/lib/libfbneo.a"
          - "-lc++"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - sdk: GameController.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
