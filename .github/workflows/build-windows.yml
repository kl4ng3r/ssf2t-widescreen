name: Build Windows launcher (NBAJamWS.exe)

on:
  workflow_dispatch:
  push:
    branches: [ main, nbajam-widescreen ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the MinGW-w64 cross compiler
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build
        run: sh windows/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: NBAJamWS-windows
          path: windows/NBAJamWS.exe
